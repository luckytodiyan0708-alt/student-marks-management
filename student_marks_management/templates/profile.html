{% extends "base.html" %}

{% block title %}My Profile & Account Settings{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <!-- BREADCRUMB -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a href="{{ url_for('dashboard.index') }}">Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Account Profile</li>
            </ol>
        </nav>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white mb-4">
            <div class="card-header bg-primary text-white py-3 px-4">
                <div class="d-flex align-items-center">
                    <i class="fa-solid fa-user-gear fa-lg me-3"></i>
                    <div>
                        <h5 class="fw-bold mb-0">Profile Information</h5>
                        <p class="small text-white-50 mb-0">Manage account details and password security</p>
                    </div>
                </div>
            </div>

            <div class="card-body p-4">
                <!-- Profile Edit Form -->
                <form method="POST" action="{{ url_for('auth.profile') }}" class="mb-4">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="action" value="update_profile">

                    <h6 class="text-uppercase text-muted fw-bold small mb-3 border-bottom pb-2">
                        <i class="fa-solid fa-id-badge me-1 text-primary"></i> Personal Details
                    </h6>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control bg-light" value="{{ user.username }}" readonly disabled>
                            <div class="form-text">System login username cannot be changed.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Role</label>
                            <input type="text" class="form-control bg-light text-uppercase fw-bold" value="{{ user.role }}" readonly disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                            <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary btn-sm px-4 fw-semibold shadow-sm">
                            <i class="fa-solid fa-check me-1"></i> Update Profile
                        </button>
                    </div>
                </form>

                <hr class="my-4">

                <!-- Change Password Form -->
                <form method="POST" action="{{ url_for('auth.profile') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="action" value="change_password">

                    <h6 class="text-uppercase text-muted fw-bold small mb-3 border-bottom pb-2">
                        <i class="fa-solid fa-key me-1 text-primary"></i> Change Password
                    </h6>

                    <div class="row g-3 mb-3">
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Current Password <span class="text-danger">*</span></label>
                            <input type="password" name="current_password" class="form-control" placeholder="Enter current password" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">New Password <span class="text-danger">*</span></label>
                            <input type="password" name="new_password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Confirm New Password <span class="text-danger">*</span></label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Re-type new password" minlength="6" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-warning text-dark btn-sm px-4 fw-semibold shadow-sm">
                            <i class="fa-solid fa-lock me-1"></i> Change Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
