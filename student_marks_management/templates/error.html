{% extends "base.html" %}

{% block title %}{{ title or 'Application Error' }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <div class="mb-3 text-danger">
                <i class="fa-solid fa-circle-exclamation fa-3x"></i>
            </div>
            <h4 class="fw-bold text-dark mb-2">{{ title or 'System Error' }}</h4>
            <p class="text-muted small mb-4">{{ message or 'An unexpected error occurred while processing your request.' }}</p>
            <div>
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-primary btn-sm px-4">
                    <i class="fa-solid fa-house me-1"></i> Go to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
