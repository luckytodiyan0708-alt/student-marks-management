{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-3 text-warning">
        <i class="fa-solid fa-triangle-exclamation fa-4x"></i>
    </div>
    <h1 class="display-4 fw-bold text-dark">404</h1>
    <h4 class="text-muted mb-3">Oops! Page Not Found</h4>
    <p class="text-secondary mb-4">The academic page or record you are searching for does not exist or may have been relocated.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 shadow-sm">
        <i class="fa-solid fa-house me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
